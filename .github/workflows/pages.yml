name: Docs

# Publishes docs/ to GitHub Pages.
#
# Pages must already be enabled for the repository with GitHub Actions as the
# source. The workflow cannot turn it on itself: configure-pages' `enablement`
# option needs admin rights that GITHUB_TOKEN does not have, and fails with
# "Resource not accessible by integration". Enable it once, from
# Settings -> Pages, or with:
#
#   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
